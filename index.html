/* Süt, mürekkep, leylak; kayısı sadece halkadaki meyvede. Palet, ailenin seçimine göre değişir. */
:root{--bg:#F7F5F9;--card:#fff;--ink:#2E2A3B;--mu:#676174;--line:#E4DFEA;--ac:#7A5C9E;--soft:#ECE6F3;--warm:#F2B880;--danger:#A8434C;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;--sans:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
[data-pal=rose]{--bg:#FBF5F7;--ac:#A4486B;--soft:#F6E3EA;--line:#EFDFE5}
[data-pal=sea]{--bg:#F3F7FA;--ac:#2E6689;--soft:#DFEBF3;--line:#DCE6ED}
[data-pal=sage]{--bg:#F4F7F4;--ac:#46705A;--soft:#E1ECE4;--line:#DCE6DF}
[data-pal=apricot]{--bg:#FCF7F2;--ac:#9C5221;--soft:#F7E6D6;--line:#EFE1D3}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.15;margin:0 0 .45em;text-wrap:balance}
h1{font-size:clamp(40px,9vw,72px);line-height:1.02;letter-spacing:-.01em}
h2{font-size:clamp(26px,4.6vw,34px)}
h3{font-size:21px}
p{margin:0 0 .8em}
a{color:var(--ac);text-underline-offset:3px}
.w{width:min(1040px,calc(100% - 32px));margin-inline:auto;padding-block:28px}
.narrow{width:min(680px,calc(100% - 32px))}
.mu{color:var(--mu);font-size:15px}
.sm{font-size:14px}
.pre{white-space:pre-line}
.lead{color:var(--mu);font-size:18px;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
.card.pad{padding:28px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.r.c{justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pill{display:inline-block;background:var(--soft);color:var(--ac);padding:3px 12px;border-radius:99px;font-size:14px;font-weight:650}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 2px}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin:4px 0}
input[type=checkbox],input[type=radio]{width:auto;margin:0 6px 0 0;accent-color:var(--ac)}
input[type=file]{border-style:dashed;padding:9px;font-size:14px}
textarea{min-height:96px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--soft);border-color:var(--ac)}
button{font:inherit;font-weight:650;background:var(--ac);color:#fff;border:0;border-radius:99px;padding:11px 20px;cursor:pointer;margin:4px 0;width:auto}
button:hover{filter:brightness(1.07)}
button.g{background:var(--soft);color:var(--ac)}
button.d{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px currentColor}
button.sm{padding:6px 13px;font-size:14px}
button:disabled{opacity:.45;cursor:default;filter:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
dialog{border:0;border-radius:22px;padding:24px;width:min(420px,calc(100% - 32px));color:var(--ink)}
dialog::backdrop{background:rgba(46,42,59,.45)}
dialog h3{margin-bottom:10px}
img{max-width:100%}
#lg{position:fixed;top:10px;right:10px;z-index:5;margin:0;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:6px 14px;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.errt{color:var(--danger);font-weight:600}
footer.w{text-align:center}

/* 40 haftalık halka: sayfanın tek gösterişli öğesi */
.ring{position:relative;width:min(250px,68vw);aspect-ratio:1;margin:0 auto 18px}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .trk{fill:none;stroke:var(--line);stroke-width:3.2}
.ring .prg{fill:none;stroke:var(--ac);stroke-width:3.2;stroke-linecap:round;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.7,.2,1)}
.ring .tk{fill:var(--mu)}
.ring .core{position:absolute;inset:11%;border-radius:50%;background:var(--soft);display:grid;place-items:center;overflow:hidden;font-size:clamp(60px,17vw,92px);line-height:1}
.ring .core img{width:100%;height:100%;object-fit:cover}
.ring .badge{position:absolute;width:21%;aspect-ratio:1;border-radius:50%;background:var(--warm);display:grid;place-items:center;font-size:clamp(20px,6vw,30px);transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--bg)}
@media (prefers-reduced-motion:reduce){.ring .prg{transition:none}}
.pap{display:block;width:84px;height:58px;border-radius:70% 45% 65% 45%;transform:rotate(-20deg);background:linear-gradient(135deg,#f3c66d,#e69a55);position:relative}.pap:before{content:"";position:absolute;width:10px;height:10px;background:#668466;border-radius:50%;top:-3px;right:7px}
.badge .pap{width:28px;height:19px}.badge .pap:before{width:5px;height:5px}

/* Aile sayfası */
.hero{text-align:center;padding:44px 0 4px}
.hero .w{padding-block:0}
.wk{font-weight:650;color:var(--ac);font-size:17px;margin:0 0 2px}
.hero h1{margin:14px 0 10px}
.par{font-size:19px;margin:0 0 4px}
.sib{color:var(--mu);margin:0 0 8px}
.hero .r.c{margin-top:16px}
.cd{display:inline-flex;gap:clamp(14px,4vw,26px);margin:22px auto 8px;padding:12px 24px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.cd b{display:block;font:400 26px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.cd span{font-size:13px;color:var(--mu)}
.greet{margin:20px 0 0;padding:0;text-align:center;font-size:20px;line-height:1.6}
.greet p{white-space:pre-line;margin:0}
.greet footer{color:var(--mu);font-size:15px;margin-top:10px}
.story{display:grid;grid-template-columns:minmax(0,auto) 1fr;gap:28px;align-items:center;border-block:1px solid var(--line);padding:26px 0}
.story .nm{font:400 clamp(44px,9vw,68px)/1 var(--serif);color:var(--ac);overflow-wrap:anywhere}
.story h2{font-size:22px}
.story p{white-space:pre-line;margin:0}
.sec{padding-top:44px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sh h2,.sh .lead{margin-bottom:4px}
.flt{margin-bottom:14px}.flt input{flex:1;min-width:180px}.flt select{width:auto}
.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.prod>img,.prod .noimg{width:100%;height:170px;object-fit:cover;display:block;background:var(--soft)}
.prod .noimg{display:grid;place-items:center;font-size:36px;height:110px}
.prod .pb{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.prod h3{font-family:var(--sans);font-weight:650;font-size:17px;margin:2px 0 6px}
.prod .meta{font-size:13px;color:var(--mu)}
.prod .r{margin-top:auto;padding-top:8px;justify-content:space-between}
.prod.done{opacity:.55}
.gg{display:grid;grid-template-columns:200px 1fr;margin-bottom:14px}
.gg>img,.gg .noimg{height:100%;min-height:170px}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.tl{position:relative;margin:8px 0 0 7px;padding-left:26px;border-left:2px solid var(--line)}
.tl .it{position:relative;padding-bottom:26px;max-width:620px}
.tl .it:before{content:"";position:absolute;left:-35px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 4px var(--ac)}
.tl .wkl{font-weight:650;color:var(--ac);font-size:15px;margin-bottom:4px}
.tl img{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:16px;margin:4px 0 8px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
.letters{display:grid;gap:12px}
.letter{background:var(--card);border:1px solid var(--line);border-radius:4px 20px 20px 20px;padding:18px 20px}
.letter p{white-space:pre-line;margin:0 0 8px}
.from{color:var(--mu);font-size:14px}
.rel{color:var(--ac);font-weight:600}
.share{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:44px}
.qr{background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line);line-height:0}
.lock{text-align:center;max-width:400px;padding-top:12vh}
.lock .ring{width:150px}
.lock .core{font-size:52px}

/* Ana sayfa */
.hh{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center;padding-top:72px}
.hh .lead{margin-bottom:20px}
.hv{text-align:center}
.fl{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px 36px}
.fl li{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.fl .ic{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:24px}
.fl h3{font-size:20px;margin-bottom:4px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.plans .ac{border-color:var(--ac)}

/* Panel */
.phd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.phd h1{font-size:clamp(32px,6vw,48px);margin:0}
.panel .card h3{margin-bottom:8px}
.sharec{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.sharec a{overflow-wrap:anywhere}
.cov{display:flex;gap:16px;align-items:flex-start}
.thumb{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-size:30px;flex-shrink:0}
.sw{border:0;padding:0;margin:14px 0 6px;display:flex;flex-wrap:wrap;gap:8px}
.sw legend{font-size:14px;font-weight:600;margin-bottom:6px;padding:0}
.sw label{display:flex;align-items:center;margin:0;padding:7px 12px 7px 9px;border:1.5px solid var(--line);border-radius:99px;font-weight:500;cursor:pointer}
.sw label:has(input:checked){border-color:var(--ac)}
.sw .dot{width:18px;height:18px;border-radius:50%;margin-right:6px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stats div{background:var(--soft);padding:10px 14px;border-radius:14px}
.stats b{display:block;font-size:18px}.stats span{font-size:13px;color:var(--mu)}
.st{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}.st th,.st td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}.st th:nth-child(-n+3),.st td:nth-child(-n+3){text-align:left}.st th{color:var(--mu);font-weight:600}
.legal{line-height:1.7}.legal h2{font-size:32px}.legal h3{font-size:20px;margin-top:26px}

@media (max-width:760px){
  .hh,.two,.plans{grid-template-columns:1fr}
  .hh{padding-top:48px;gap:20px}.hv{order:-1}
  .gg{grid-template-columns:1fr}.gg>img,.gg .noimg{min-height:0;height:170px}
  .story{grid-template-columns:1fr;gap:8px;text-align:center}
  .cd{padding:10px 18px}
}

async function mkslug(v){
  const base=v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30)||'bebek';
  const {data:adm}=await sb.rpc('is_admin');if(adm)return base;   // admin 'demo' gibi sade adres alabilir
  const b=new Uint8Array(6);crypto.getRandomValues(b);
  return base+'-'+[...b].map(x=>(x%36).toString(36)).join('');
}

/* ---- Fotoğraflar: tarayıcıda küçültülür ve yeniden çizilir, böylece EXIF/konum bilgisi silinir ---- */
const PH_RE=/^[0-9a-f-]{36}\/[0-9a-f-]{36}\.jpg$/;
const purl=p=>PH_RE.test(p||'')?SUPABASE_URL+'/storage/v1/object/public/photos/'+p:'';
async function shrink(f){
  if(!f||!/^image\//.test(f.type))throw new Error(L('Lütfen bir fotoğraf seçin.','Please choose a photo.'));
  if(f.size>25e6)throw new Error(L('Fotoğraf çok büyük (en fazla 25 MB).','The photo is too large (max 25 MB).'));
  let src;
  try{src=await createImageBitmap(f,{imageOrientation:'from-image'})}
  catch(_){src=await new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>no(new Error(L('Bu fotoğraf açılamadı. JPEG veya PNG deneyin.','This photo could not be opened. Try JPEG or PNG.')));i.src=u})}
  const W=src.width,H=src.height,s=Math.min(1,1600/Math.max(W,H)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(W*s));c.height=Math.max(1,Math.round(H*s));c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  for(const q of [.85,.7,.55]){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(b&&b.size<=3e6)return b}
  throw new Error(L('Fotoğraf küçültülemedi.','The photo could not be resized.'));
}

    $('tr_cp').onclick=()=>navigator.clipboard.writeText(lk).then(()=>alert('Kopyalandı'),()=>$('tr_link').select())};
  $('dpg').onclick=async()=>{if(!confirm('Sayfa silinsin mi? Bu işlem geri alınamaz.'))return;await rmAllPhotos(pg);const {error}=await sb.from('pages').delete().eq('id',pg.id);if(!err(error))go()};
  $('dac').onclick=async()=>{if(!confirm('Hesabınız ve tüm verileriniz kalıcı olarak silinsin mi? Bu işlem geri alınamaz.'))return;await rmAllPhotos(pg);const {error}=await sb.rpc('delete_my_account');if(err(error))return;await sb.auth.signOut();alert('Hesabınız silindi.');nav('#/')};
  $('pu').onclick=async ev=>{const b=$('ub').value.trim();if(!b)return;const f=$('uf').files[0];let path=null;busy(ev.target,true);
    try{if(f)path=await upPhoto(pg,f)}catch(x){busy(ev.target,false);return alert(x.message)}
    const {error}=await sb.from('updates').insert({page_id:pg.id,body:b,week:+$('uw').value||null,photo_path:path});
    if(error){if(path)await rmPhotos([path]);busy(ev.target,false);return err(error)}alert('Paylaşıldı');go()};
  $('sv').onclick=async()=>{const n=k=>$(k).value.trim()||null;
    const {error}=await sb.from('pages').update({baby_name:$('s_bn').value.trim(),parents:$('s_pa').value.trim(),lang:$('s_lang').value,theme:$('s_theme').value,wishlist_url:n('s_wl'),due_date:n('s_dd'),letters_open_at:n('s_lo'),born:$('s_born').checked}).eq('id',pg.id);
    if(!err(error)){alert('Kaydedildi');go()}};
}
window.dup=async id=>{if(!confirm('Silinsin mi?'))return;const x=(window.UPS||[]).find(r=>r.id===id);
  const {error}=await sb.from('updates').delete().eq('id',id);if(err(error))return;if(x)await rmPhotos([x.photo_path]);go()};
</script></body></html>
