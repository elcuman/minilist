const LG={
privacy:{tr:`<h2>Gizlilik ve KVKK Aydınlatma Metni</h2><p class="mu">Son güncelleme: 7 Ekim 2026. Bu sayfa bilgilendirme amaçlıdır.</p>
<h3>1. Veri sorumlusu</h3><p>Minilist (minilist.co) hizmetinin işletmecisi.</p>

<h3>4. Aktarım</h3><p>Verileriniz, hizmeti sunmak için çalıştığımız sağlayıcılara aktarılır ve bunlar yurt dışında olabilir: veritabanı ve kimlik doğrulama (Supabase), yayın ve barındırma (Vercel), ödeme (Polar, kart bilgilerinizi biz görmeyiz) ve ücretsiz planda reklam sağlayıcısı. Yurt dışı aktarımda KVKK'daki şartlara uyulur.</p>

en:`<h2>Privacy and Data Protection Notice</h2><p class="mu">Last updated: October 7, 2026. This page is for information purposes.</p>
<h3>1. Data controller</h3><p>The operator of the Minilist service (minilist.co).</p>
<h3>2. Data we process</h3><ul><li><b>Account:</b> email address and password (the password is stored as a one-way hash).</li><li><b>Family page:</b> baby's name, parents' names, due date, gift list, weekly notes and other information entered by the parent.</li><li><b>Guests:</b> the name, note, letter, name or product suggestion and gift reservation/contribution details they leave without creating an account.</li><li><b>Technical:</b> IP and device logs kept by our hosting provider; to prevent abuse, the IP address of guest actions is also kept for at most 1 day.</li><li><b>Advertising:</b> cookies from the ad provider on the free plan.</li></ul>
<h3>3. Purpose and legal basis</h3><p>To provide the service and manage your account (performance of a contract), keep it secure, meet legal obligations and verify payment for the paid plan. We ask for your consent for advertising cookies.</p>
<h3>4. Sharing and transfers</h3><p>Your data is shared with providers we use to run the service, which may be located abroad: database and authentication (Supabase), hosting and delivery (Vercel), payments (Polar; we never see your card details) and, on the free plan, the ad provider. Cross-border transfers follow applicable law.</p>
<h3>5. Retention</h3><p>We keep your data while your account is open. On your deletion request we delete your account and page.</p>
<h3>6. Your rights</h3><p>You can ask whether we process your data, request access, correction or deletion, object to processing and claim compensation for damage, as provided by the Turkish Personal Data Protection Law (KVKK, Art. 11) and other applicable law. Contact channels will be published on this page soon.</p>
<h3>7. Important: your page is public</h3><p>A family page can be viewed by anyone who has the link. Share the link only with people you trust and do not enter sensitive information such as health details. You enter information about the baby as a parent.</p>`},
terms:{tr:`<h2>Kullanım Şartları</h2><p class="mu">Son güncelleme: 7 Ekim 2026. Bu sayfa bilgilendirme amaçlıdır.</p>

<h3>6. İade</h3><p>Pro plan için iade talepleri, satın alma sırasında kullanılan ödeme sağlayıcısı üzerinden yürütülür. Yasal haklarınız saklıdır.</p>
<h3>7. Sorumluluk</h3><p>Hizmet "olduğu gibi" sunulur; kesintisiz veya hatasız olacağı garanti edilmez. Yasaların izin verdiği ölçüde dolaylı zararlardan sorumlu değiliz.</p>
<h3>8. Değişiklik ve uyuşmazlık</h3><p>Şartları güncelleyebiliriz; önemli değişiklikleri duyururuz. Türk hukuku uygulanır; tüketici mercilerine başvuru hakkınız saklıdır.</p>`,
en:`<h2>Terms of Use</h2><p class="mu">Last updated: October 7, 2026. This page is for information purposes.</p>
<h3>1. The service</h3><p>Minilist lets families involve their circle from pregnancy onward with a gift list, letters and updates. By using the service you accept these terms.</p>
<h3>2. Account</h3><p>You are responsible for the accuracy and security of your account details. One family page can be created per account.</p>

async function mkslug(v){
  const base=v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30)||'bebek';
  const {data:adm}=await sb.rpc('is_admin');if(adm)return base;   // admin 'demo' gibi sade adres alabilir
  const b=new Uint8Array(6);crypto.getRandomValues(b);
  return base+'-'+[...b].map(x=>(x%36).toString(36)).join('');
}

  ${pg.plan==='free'&&AD_HTML?`<br><div class="card" id="adbox">${AD_HTML}</div>`:''}
  <br><div class="card r"><a href="${wa(pg)}" target="_blank" rel="noopener"><button>WhatsApp'ta paylaş</button></a><div id="qrv"></div></div>`;
  if($('adbox'))try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(_){}
  if(window.QRCode)new QRCode($('qrv'),{text:plink(pg),width:120,height:120});
  $('nsb').onclick=async()=>{const a=$('nn').value.trim(),f=$('nf').value.trim();if(!a||!f)return alert('Lütfen isim ve adınızı yazın');
    const {error}=await sb.rpc('guest_suggest',{p_slug:pg.slug,p_name:a,p_from:f,p_note:$('nt').value.trim()||null});if(!err(error)){alert('Öneriniz iletildi!');['nn','nf','nt'].forEach(i=>$(i).value='')}};
  $('ls').onclick=async()=>{const n=$('ln').value.trim(),b=$('lb').value.trim();if(!n||!b)return alert('Adınızı ve mektubu yazın');
    const {error}=await sb.rpc('guest_letter',{p_slug:pg.slug,p_name:n,p_body:b});if(!err(error)){alert('Mektubunuz bırakıldı 💌');$('lb').value=''}};
}

async function pextras(pg){
  const box=[...app.querySelectorAll('.w')].pop(),d=document.createElement('div');box.append(d);
  const gq=t=>sb.from(t).select('*').eq('page_id',pg.id).order('id',{ascending:false});
  const [ls,ns,ups,sg]=(await Promise.all(['letters','name_suggestions','updates','product_suggestions'].map(gq))).map(r=>r.data||[]);
  const v=x=>e(x??'');
  window.SG=sg;window.PG=pg;
  d.innerHTML=`
  <br><div class="card"><h3>Gelen ürün önerileri (${sg.length})</h3>${sg.map(x=>`<p><b>${e(x.name)}</b> · ${e(x.from_name)}${x.note?` <span class="mu">— ${e(x.note)}</span>`:''}${u(x.link)?` <a href="${u(x.link)}" target="_blank" rel="noopener">bağlantı</a>`:''} <button class="g" onclick="sga(${x.id})">Listeye ekle</button> <button class="d" onclick="dx('product_suggestions',${x.id})">Sil</button></p>`).join('')||'<p class="mu">Henüz öneri yok. Sayfanızı açan misafirler "Ürün öner" ile ekleyebilir.</p>'}</div>
  <br><div class="card"><h3>Toplu ekle ve Amazon istek listesi</h3>
  <p class="mu"><b>Hızlı başlangıç:</b> hazır bir bebek listesiyle başlayın, sonra düzenleyin.</p><button class="g" id="stl">Örnek listeyi ekle</button>
  <p class="mu" style="margin-top:14px"><b>Amazon istek listesi:</b> Amazon, listelerini başka sitelerin otomatik okumasına izin vermiyor. Bu yüzden listeyi tarayıcınızdan siz aktarırsınız:</p>
  <ol class="mu"><li>Aşağıdaki <a id="bkm" href="#">Minilist'e aktar</a> bağlantısını yer imleri çubuğuna sürükleyin (bir kez).</li><li>Amazon'da istek listenizi açın, tüm ürünler yüklenene kadar aşağı kaydırın ve yer imine tıklayın. Liste kopyalanır.</li><li>Aşağıdaki kutuya yapıştırıp "Listeye aktar" deyin.</li></ol>
  <textarea id="bk" rows="5" placeholder="Her satıra bir ürün: Ürün adı | https://bağlantı | https://görsel (görsel isteğe bağlı). Sadece ürün bağlantısı da yapıştırabilirsiniz."></textarea>
  <button id="bkgo">Listeye aktar</button></div>
  <br><div class="card"><h3>Sayfayı aileye devret</h3><p class="mu">Sayfayı sizin için hazırladıysanız veya birine veriyorsanız: aile önce Minilist'e kayıt olsun, sonra e-posta adreslerini yazın. Devirden sonra sayfanın yönetimi onlarda olur, sizin erişiminiz kalkar.</p>
  <input id="tr_em" type="email" placeholder="Ailenin e-posta adresi"><button class="d" id="tr_go">Sayfayı devret</button></div>
  ${pg.plan==='free'?`<br><div class="card"><h3>Reklamsız Pro</h3><p class="mu">Reklamları kaldırır, ürün sınırını açar ve anı defterini PDF indirmenizi sağlar. Tek seferlik ödeme.</p>${PAYMENTS?'<button id="up">Pro\'ya geç</button>':'<p class="mu"><b>Beta:</b> Pro özellikleri davet edilen ailelere ücretsiz açılır.</p>'}</div>`:'<br><div class="card"><b>Pro aktif ✓</b><div class="r"><button id="bk">Anı defterini indir (PDF)</button></div></div>'}
  <br><div class="card"><h3>Hafta hafta paylaş</h3><p class="mu">Kısa bir not yeterli: bebek ne yaptı, nasıl hissediyorsunuz? Aile kalp bırakır.</p>
  <input id="uw" type="number" min="1" max="42" placeholder="Hamilelik haftası"><textarea id="ub" placeholder="Bu hafta neler oldu?"></textarea><button id="pu">Paylaş</button></div>
  <br><div class="card"><h3>Sayfa ayarları</h3><input id="s_bn" value="${v(pg.baby_name)}" placeholder="Bebeğin adı"><input id="s_pa" value="${v(pg.parents)}" placeholder="Anne ve baba adları"><label class="mu">Sayfa dili / Page language</label><select id="s_lang"><option value="tr">Türkçe</option><option value="en">English</option></select><label class="mu">Sayfa teması (cinsiyet belli olunca değiştirin, sayfada duyuru çıkar)</label><select id="s_theme"><option value="neutral">Nötr (sürpriz)</option><option value="girl">Kız teması</option><option value="boy">Erkek teması</option></select>
  <label class="mu">Tahmini doğum tarihi</label><input id="s_dd" type="date" value="${v(pg.due_date)}">
  <input id="s_wl" value="${v(pg.wishlist_url)}" placeholder="Harici hediye listesi bağlantısı (Amazon vb.)">
  <label class="mu">Mektupların açılacağı tarih</label><input id="s_lo" type="date" value="${v(pg.letters_open_at)}">
  <label><input id="s_born" type="checkbox" style="width:auto" ${pg.born?'checked':''}> Bebek doğdu 🎉 (sayfada doğum haberi görünür)</label>
  <button id="sv">Kaydet</button></div>
  <br><div class="card"><b>${ls.length} mektup geldi</b><p class="mu">Mektuplar ${pg.letters_open_at?v(pg.letters_open_at)+' tarihinde':'bir tarih seçince'} herkese açılır.</p>
  ${ls.map(l=>`<p><b>${e(l.name)}:</b> ${e(l.body)} <button class="d" onclick="dx('letters',${l.id})">Sil</button></p>`).join('')}
  <a href="${wa(pg)}" target="_blank" rel="noopener"><button>${pg.born?'Doğum haberini WhatsApp\'ta ilet':'WhatsApp\'ta davet et'}</button></a><div id="qrp" style="margin-top:12px"></div></div>
  <br><div class="card"><h3>İsim önerileri</h3>${ns.map(n=>`<p><b>${e(n.name)}</b> · ${e(n.from_name)}${n.note?` <span class="mu">— ${e(n.note)}</span>`:''} <button class="d" onclick="dx('name_suggestions',${n.id})">Sil</button></p>`).join('')||'<p class="mu">Henüz isim önerisi yok.</p>'}</div>
  <br><div class="card"><h3>Paylaşımlarınız</h3>${ups.map(u=>`<p>${u.week?`<b>${u.week}. hafta</b> · `:''}${e(u.body)} <button class="d" onclick="dx('updates',${u.id})">Sil</button></p>`).join('')||'<p class="mu">Henüz paylaşım yok.</p>'}</div>
  <br><div class="card"><h3>Tehlikeli bölge</h3><div class="r"><button class="d" id="dpg">Sayfamı sil</button><button class="d" id="dac">Hesabımı sil</button></div></div>`;
  $('s_lang').value=pg.lang||'tr';$('s_theme').value=pg.theme||'neutral';
  if($('bk'))$('bk').onclick=()=>book(pg);
  if($('up'))$('up').onclick=async()=>{const {data,error}=await sb.functions.invoke('polar-checkout');if(err(error))return;if(data?.url)location.href=data.url;else alert(data?.error||'Ödeme açılamadı')};
  if(window.QRCode)new QRCode($('qrp'),{text:plink(pg),width:120,height:120});

  $('stl').onclick=async()=>{const k=LANG==='en'?'en':'tr',rows=STARTER[k].map(r=>({page_id:pg.id,name:r[0],category:r[1],description:r[2]+' · '+r[3],quantity:r[4],target_amount:r[5]}));
    await addRows(pg,rows)};
  $('bkgo').onclick=()=>addRows(pg,parseLines(pg,$('bk').value));
  $('bkm').onclick=ev=>ev.preventDefault();$('bkm').href='javascript:'+encodeURIComponent(BKM);
  $('tr_go').onclick=async()=>{const m=$('tr_em').value.trim();if(!m)return alert('E-posta adresini yazın');
    if(!confirm('Sayfa bu hesaba devredilsin mi? Devirden sonra sayfayı siz yönetemezsiniz.'))return;
    const {error}=await sb.rpc('transfer_page',{p_page:pg.id,p_email:m});if(err(error))return;alert('Sayfa devredildi.');go()};
  $('dpg').onclick=async()=>{if(!confirm('Sayfa silinsin mi? Bu işlem geri alınamaz.'))return;const {error}=await sb.from('pages').delete().eq('id',pg.id);if(!err(error))go()};
  $('dac').onclick=async()=>{if(!confirm('Hesabınız ve tüm verileriniz kalıcı olarak silinsin mi? Bu işlem geri alınamaz.'))return;const {error}=await sb.rpc('delete_my_account');if(err(error))return;await sb.auth.signOut();alert('Hesabınız silindi.');nav('#/')};
  $('pu').onclick=async()=>{const b=$('ub').value.trim();if(!b)return;const {error}=await sb.from('updates').insert({page_id:pg.id,body:b,week:+$('uw').value||null});if(!err(error)){alert('Paylaşıldı');go()}};
  $('sv').onclick=async()=>{const n=k=>$(k).value.trim()||null;
    const {error}=await sb.from('pages').update({baby_name:$('s_bn').value.trim(),parents:$('s_pa').value.trim(),lang:$('s_lang').value,theme:$('s_theme').value,wishlist_url:n('s_wl'),due_date:n('s_dd'),letters_open_at:n('s_lo'),born:$('s_born').checked}).eq('id',pg.id);
    if(!err(error)){alert('Kaydedildi');go()}};
}
</script></body></html>
